schema: spec-driven

# 헌장의 기계 판독 부분. 전문은 ../CONSTITUTION.md
# 여기를 고치면 CONSTITUTION.md도 같이 고친다.

context: |
  # 산스 인생책 로마쇠망사 자료실

  기번 『로마제국쇠망사』 한국어 편역본(30포인트)·영문 원전과, 거기서 뽑은
  객체 644개 + 관계 667개 지식그래프를 편데 운영팀이 쓰게 만드는 정적 사이트.
  독자는 깃을 못 쓰는 팀원들이다. 1인 개발 + AI 에이전트 병렬.

  ## 이 도구의 크기 — 다른 모든 규칙보다 위에 있다
  이 도구는 헷갈림을 덜어주는 만큼만 존재한다. 자랑하려고 만드는 물건이 아니다.
  완성이 목표가 아니라 진짜 쓰임 하나가 목표다 — 볼트 USECASE.md 의
  "발표 담당자가 인물 파트를 준비한다" 여섯 단계가 그 하나이고, 기능 목록이
  아니라 이 시나리오가 우선순위를 정한다. 뒷단(데이터)이 방대한 만큼
  앞단(화면)은 골라서 심플하게 간다. 기한에 쫓겨 범위를 늘리지 않는다.

  판정 질문 — 기능을 넣을지 말지 막히면 이것을 묻는다.
  "이게 사람들이 헷갈려 하는 지점을 덜어주나, 아니면 우리가 만든 걸 보여주나?"
  뒤쪽이면 넣지 않는다.

  ## 백엔드가 없다
  output: 'export' 정적 빌드. 서버·API·DB가 없고 런타임 서버 코드는 0줄이다.
  "백엔드"에 해당하는 것은 빌드 시점 데이터 파이프라인이다.
  API를 만들자는 제안은 헌장을 고치는 사안이므로 그냥 진행하지 말 것.

  ## 스택 (실측 2026-08-13)
  Next.js 16.3.0 (학습 데이터의 15와 다르다 — node_modules/next/dist/docs/ 를
  읽고 쓸 것) · React 19.2.8 · TypeScript 5.9.3 · Zod 4.4.3 ·
  Vitest 4.1.10 · Playwright 1.62.1 · jsdom 29.1.1
  예정: @astryxdesign/core 0.3.0(사전컴파일 CSS) · pagefind 1.5.2 ·
  gray-matter · next-mdx-remote(MPL-2.0) · remark-wiki-link
  문서 프레임워크(Starlight·Nextra·Fumadocs)는 쓰지 않는다.

  ## 폴더 경계 — 로직은 전부 lib/ 에 산다
  lib/ontology.ts   데이터 계약(스키마·로더·불변식). 스키마는 여기 하나뿐이다
  lib/<도메인>/      서비스 로직. 순수 함수. React를 import 하지 않는다
  components/       받은 값을 그리는 일만. 파일 읽기·jsonl 파싱 금지
  app/              라우팅과 조립만. 세 줄 넘는 변환이 보이면 lib/로 내린다
  e2e/              Playwright 시나리오
  테스트는 대상 파일 옆에 *.test.ts(x). E2E만 e2e/ 에 따로 둔다.
  노드 API가 필요한 테스트는 첫 줄에 // @vitest-environment node

  ## 데이터 계약이 급소다
  npm run build 가 validate 를 먼저 돌린다. 불변식이 깨지면 빌드가 멈춘다.
  알려진 위반은 lib/ontology.test.ts 의 KNOWN_VIOLATIONS 에 이유와 함께
  통과시킨다. 목표는 "위반 0"이 아니라 "새 위반이 늘지 않는 것"이다 —
  0으로 만들려고 억지 배정하면 데이터가 오염된다. 고친 위반은 목록에서 지운다.
  사이트는 데이터를 읽기만 한다. 수정은 ../.agent/skills/propose-change/ 절차.

  ## 데이터를 만지기 전에
  레포 루트 ../AGENTS.md 가 정본이다. 불변식 6개와 실제로 밟은 함정 12개가
  거기 있다. 특히 rome30_merge.py 를 다시 돌리면 2주치가 사라진다.

  ## 문서 분업
  볼트 Works/로마쇠망사_자료실/ = 왜 이렇게 만드나(설계 맥락). 헌장의 정본도 여기다
  openspec/                    = 무엇을 언제 바꿨나
  같은 내용을 두 군데 쓰지 않는다.

rules:
  proposal:
    - 한국어로 쓴다.
    - 무엇을 왜 바꾸는지 먼저 적는다. 어떻게는 그다음이다.
    - 판정 질문에 한 줄로 답한다. 이것이 헷갈림을 덜어주는가, 우리가 만든 걸
      보여주는가. 그리고 볼트 USECASE.md 여섯 단계 중 어디에 걸리는지 적는다.
      아무 데도 안 걸리면 왜 지금 만드는지를 남긴다.
    - 이번에 하지 않는 것(Non-goals) 절을 반드시 넣는다.
    - 백엔드·API·서버 상태를 도입하는 제안이면 헌장 위반임을 명시하고 멈춘다.
    - 새 라이브러리를 넣는 제안이면 버전·라이선스·최종배포일을 확인해 적는다.
      기억으로 쓰지 않는다. 표준 라이브러리나 기존 의존성으로 되는지 먼저 따진다.

  tasks:
    - 한국어로 쓴다.
    - TDD 순서로 쪼갠다 — 각 작업은 "실패하는 테스트"로 시작해 "통과"로 끝난다.
    - 테스트 없이 갈 작업이면 왜 없어도 되는지 한 줄로 적는다
      (한 줄 함수·상수·app/ 조립·라이브러리가 이미 보장하는 것).
    - 데이터 로딩·변환, 위키링크 URL 치환, 시트 내보내기, 연도 계산,
      불변식 검사는 테스트를 반드시 동반한다. 여기가 위험이 사는 곳이다.
    - 마지막 작업은 항상 코드 리뷰다 (아래 operations.archive 참조).

operations:
  apply:
    guidance:
      - RED → GREEN → REFACTOR 순서를 지킨다.
      - RED에서 테스트가 실제로 실패하는 것을 눈으로 확인하고 보고한다.
        통과하는 걸 보고 넘어가면 그 테스트는 아무것도 검사하지 않았을 수 있다.
      - 실패 메시지가 무엇이 왜 틀렸는지 말하는지 확인한다.
      - GREEN에서는 통과할 만큼만 쓴다. 추상화를 여기서 만들지 않는다.
      - REFACTOR에서 테스트를 고쳐야 통과한다면 그건 리팩토링이 아니라
        동작 변경이다. RED로 돌아간다.
      - app/ 에 로직을 두지 않는다. lib/<도메인>/ 은 React를 모른다.
      - 스키마를 lib/ontology.ts 밖에 또 만들지 않는다.

  archive:
    guidance:
      - 닫기 전에 코드 리뷰를 반드시 한 번 더 돈다. 초록은 끝이 아니다.
      - 판정 질문을 다시 던진다. 만든 것이 헷갈림을 덜어주는 자리에 있는지,
        USECASE 여섯 단계 중 어디를 열었는지 한 줄로 적는다.
      - 리뷰 목적은 버그 찾기가 아니라 공통 로직 발견과 중복 제거다.
      - 중복 — 같은 일을 하는 것이 lib/ 에 이미 있는가. 같은 변환이 두 군데
        이상 있는가. 세 번째가 나타나면 반드시 lib/ 로 올린다.
      - 경계 — app/ 에 로직이 들어갔는가. lib/<도메인>/ 이 React를 import
        하는가. components/ 가 파일을 읽는가. 스키마가 두 벌인가.
      - 데이터 계약 — KNOWN_VIOLATIONS 가 늘었는가, 늘었으면 이유가 적혀
        있는가. 고친 위반을 목록에서 지웠는가. 빌드 게이트를 우회했는가.
      - 죽은 것 — 안 쓰는 export·import·파일·의존성, 주석 처리된 코드,
        "나중에 쓸 것 같아서" 남긴 추상화.
      - 테스트 — 구현 세부가 아니라 동작을 검사하는가. 이 테스트는 무엇이
        깨지면 빨개지는가. 답이 없으면 지운다.
      - 고칠 것이 나오면 고치고 테스트를 다시 돌린 뒤 아카이브한다.
      - 지금 안 고치기로 한 것은 부채로 명시한다. 조용히 넘기지 않는다.
      - 리뷰 결과를 한국어로 요약한다.
