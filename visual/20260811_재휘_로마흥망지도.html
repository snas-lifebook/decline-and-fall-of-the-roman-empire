<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>로마 제국 흥망 지도 — 건국부터 쇠망까지</title>
<style>
  :root{
    --parchment:#f3ead4;
    --parchment-dark:#e6d9b8;
    --ink:#3a2f22;
    --ink-soft:#6b5c46;
    --accent:#8c2f2f;
    --gold:#b8860b;
    --sea:#a9cfdc;
    --land:#e9dfc2;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:"Noto Serif KR", Georgia, "Nanum Myeongjo", serif;
    background:linear-gradient(180deg,#efe3c4,#e3d5ac);
    color:var(--ink);
    padding:18px;
  }
  h1{
    text-align:center;
    font-size:1.6em;
    margin:4px 0 2px;
    letter-spacing:1px;
  }
  .subtitle{
    text-align:center;
    color:var(--ink-soft);
    font-size:0.85em;
    margin-bottom:14px;
  }
  .wrap{
    max-width:1280px;
    margin:0 auto;
  }
  .layout{
    display:flex;
    gap:16px;
    align-items:stretch;
    flex-wrap:wrap;
  }
  .map-panel{
    flex:1 1 640px;
    background:var(--parchment);
    border:1px solid #c9b98a;
    border-radius:10px;
    padding:10px;
    box-shadow:0 4px 14px rgba(60,45,20,0.18);
    position:relative;
    min-width:320px;
  }
  .side-panel{
    flex:0 0 320px;
    background:var(--parchment);
    border:1px solid #c9b98a;
    border-radius:10px;
    padding:16px;
    box-shadow:0 4px 14px rgba(60,45,20,0.18);
    max-height:640px;
    overflow-y:auto;
  }
  svg#map{
    width:100%;
    height:auto;
    display:block;
    border-radius:6px;
    background:var(--sea);
  }
  .region{
    stroke:#8a7a5c;
    stroke-width:1;
    transition:fill 0.5s ease, stroke 0.5s ease, opacity 0.5s ease;
    stroke-dasharray:2,2;
    fill:transparent;
  }
  .region.controlled{
    stroke-width:1.6;
    stroke-dasharray:none;
    opacity:0.86;
  }
  .region-label{
    font-size:9px;
    fill:#2c2416;
    pointer-events:none;
    font-family:Georgia, serif;
    paint-order:stroke;
    stroke:#f3ead4;
    stroke-width:2px;
  }
  .island,.landbase{
    fill:var(--land);
    stroke:#b7a878;
    stroke-width:0.8;
  }
  .sea-detail{
    fill:var(--sea);
  }
  .event-marker circle{
    stroke:#f3ead4;
    stroke-width:1.2;
  }
  .event-marker .symbol{
    font-size:8px;
    fill:#f3ead4;
    text-anchor:middle;
    pointer-events:none;
    font-family:Georgia, serif;
    font-weight:700;
  }
  .event-marker{ cursor:pointer; }
  .event-marker:hover circle{ stroke:#2c2416; stroke-width:2; }

  .marker-legend{
    display:flex;
    gap:10px;
    font-size:0.76em;
    margin-top:6px;
    flex-wrap:wrap;
  }
  .marker-legend .mitem{
    display:flex;
    align-items:center;
    gap:4px;
  }
  .marker-legend .dot{
    display:inline-block;
    width:12px;height:12px;
    border-radius:50%;
    text-align:center;
    font-size:8px;
    line-height:12px;
    color:#f3ead4;
  }
  .ev-icon{
    display:inline-block;
    width:14px;
    text-align:center;
  }

  .era-title{
    font-size:1.15em;
    font-weight:700;
    margin:0 0 4px;
    color:var(--accent);
  }
  .era-year{
    font-size:0.85em;
    color:var(--ink-soft);
    margin-bottom:10px;
  }
  .era-desc{
    font-size:0.92em;
    line-height:1.6;
    margin-bottom:14px;
  }
  .section-title{
    font-size:0.85em;
    font-weight:700;
    color:var(--ink-soft);
    border-bottom:1px solid #c9b98a;
    padding-bottom:4px;
    margin:14px 0 8px;
    letter-spacing:1px;
  }
  ul.events{
    list-style:none;
    margin:0;
    padding:0;
    font-size:0.88em;
  }
  ul.events li{
    padding:6px 0;
    border-bottom:1px dashed #d8c99b;
  }
  ul.events li b{ color:var(--accent); }

  .legend{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    font-size:0.78em;
  }
  .legend span.swatch{
    display:inline-block;
    width:11px;height:11px;
    border-radius:2px;
    margin-right:4px;
    vertical-align:-1px;
    border:1px solid rgba(0,0,0,0.35);
  }
  .legend-item{
    display:flex;
    align-items:center;
    background:var(--parchment-dark);
    border-radius:4px;
    padding:2px 6px;
  }

  .controls{
    max-width:1280px;
    margin:16px auto 0;
    background:var(--parchment);
    border:1px solid #c9b98a;
    border-radius:10px;
    padding:14px 18px 10px;
    box-shadow:0 4px 14px rgba(60,45,20,0.18);
  }
  .slider-row{
    display:flex;
    align-items:center;
    gap:12px;
  }
  #playBtn{
    background:var(--accent);
    color:#fff;
    border:none;
    border-radius:50%;
    width:38px;height:38px;
    font-size:1em;
    cursor:pointer;
    flex:0 0 auto;
  }
  #playBtn:hover{ background:#6f2323; }
  input[type=range]{
    flex:1;
    accent-color:var(--accent);
    height:6px;
  }
  .ticks{
    display:flex;
    justify-content:space-between;
    margin-top:8px;
    padding:0 2px;
  }
  .tick{
    background:none;
    border:none;
    font-size:0.68em;
    color:var(--ink-soft);
    cursor:pointer;
    font-family:inherit;
    white-space:nowrap;
    padding:2px 3px;
    border-radius:3px;
  }
  .tick:hover, .tick.active{
    color:var(--accent);
    font-weight:700;
    background:var(--parchment-dark);
  }
  .note{
    text-align:center;
    font-size:0.72em;
    color:var(--ink-soft);
    margin-top:14px;
    max-width:1280px;
    margin-left:auto;
    margin-right:auto;
  }
  @media (max-width:760px){
    .side-panel{ flex:1 1 100%; max-height:none; }
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>로마, 흥망의 지도</h1>
  <div class="subtitle">기원전 753년 건국부터 서기 1453년 콘스탄티노플 함락까지 — 슬라이더로 시대를 넘겨보세요</div>

  <div class="layout">
    <div class="map-panel">
      <svg id="map" viewBox="0 0 950 620" xmlns="http://www.w3.org/2000/svg">
        <!-- 바다 배경 -->
        <rect x="0" y="0" width="950" height="620" fill="var(--sea)"></rect>

        <!-- 육지 기본 실루엣 (대륙) -->

        <!-- 페르시아만 -->
        <path class="sea-detail" d="M870,440 L900,430 L925,450 L920,480 L890,485 L870,465 Z"></path>

        <!-- 지중해의 섬들 -->
        <path class="island" d="M410,335 L430,330 L445,340 L440,355 L420,360 L405,350 Z"></path> <!-- 시칠리아 -->

        <path class="island" d="M345,240 L355,238 L358,258 L348,262 Z"></path> <!-- 코르시카 -->

        <g id="regions">

          <path class="region" data-region="gallia" d="M150,140 L250,110 L330,120 L345,180 L330,230 L280,255 L230,260 L180,230 L145,190 Z"></path>
          <path class="region" data-region="hispania" d="M95,215 L150,195 L190,235 L200,300 L160,335 L120,335 L90,300 L70,260 L75,225 Z"></path>
          <path class="region" data-region="italia" d="M375,175 L400,170 L410,230 L420,270 L415,300 L430,330 L415,345 L400,335 L390,300 L380,260 L370,220 L370,190 Z"></path>

          <path class="region" data-region="illyricum_balkans" d="M420,145 L480,135 L540,160 L560,210 L520,250 L470,235 L430,205 Z"></path>

          <path class="region" data-region="numidia_mauretania" d="M100,370 L280,353 L300,395 L260,430 L150,440 L100,410 Z"></path>

        </g>

        <!-- 지명 라벨 -->
        <g id="labels" font-family="Georgia, serif" fill="#2c2416" style="pointer-events:none;">
          <text class="region-label" x="378" y="252">ROMA</text>
          <text class="region-label" x="200" y="185">GALLIA</text>
          <text class="region-label" x="120" y="270">HISPANIA</text>

          <text class="region-label" x="505" y="135">DACIA</text>
          <text class="region-label" x="390" y="140">GERMANIA</text>
          <text class="region-label" x="655" y="200">BYZANTIUM</text>
        </g>

        <!-- 이벤트 마커 그룹 (JS로 채움) -->
        <g id="eventMarkers"></g>
      </svg>
    </div>

    <div class="side-panel">
      <div class="era-title" id="eraTitle">-</div>
      <div class="era-year" id="eraYear">-</div>
      <div class="era-desc" id="eraDesc">-</div>

      <div class="section-title">이 시기의 사건 · 전투 · 인물</div>
      <div class="marker-legend">
        <span class="mitem"><span class="dot" style="background:#8c2f2f;">⚔</span>전투</span>
        <span class="mitem"><span class="dot" style="background:#1f3f6e;">♛</span>인물</span>
        <span class="mitem"><span class="dot" style="background:#b8860b;">●</span>사건/정치</span>
      </div>
      <ul class="events" id="eventList"></ul>

      <div class="section-title">영역 범례 (지도 색)</div>
      <div class="legend" id="legend"></div>
    </div>
  </div>

  <div class="controls">
    <div class="slider-row">
      <button id="playBtn" title="자동 재생">▶</button>
      <input type="range" id="slider" min="0" max="14" step="1" value="0">
    </div>
    <div class="ticks" id="ticks"></div>
  </div>

  <div class="note">지도는 역사 자료를 바탕으로 단순화·양식화한 근사도입니다. 고대·중세의 국경은 현대적 의미의 확정선이 아니었으며, 특히 사막·초원·유목 세력의 경계는 유동적이었습니다.</div>
</div>

<script>
const ACTORS = {
  rome:            {label:"로마 (통일 제국)", color:"#b5302f"},
  rome_west:       {label:"서로마 제국", color:"#b5302f"},
  rome_east:       {label:"동로마 제국 (비잔티움)", color:"#7a3f9c"},

  "africa_proconsularis","numidia_mauretania","cyrenaica","aegyptus"];

    {x:398,y:262,title:"로물루스",desc:"전설상 로마의 초대 왕. 쌍둥이 동생 레무스를 죽이고 도시를 세웠다고 전해진다.",type:"person"}
  ]
},

const svgNS = "http://www.w3.org/2000/svg";
const regionEls = {};
ALL_REGIONS.forEach(id=>{
  regionEls[id] = document.querySelector('.region[data-region="'+id+'"]');
});

function applyEra(idx){
  idx = parseInt(idx);
  const era = eras[idx];
  document.getElementById('eraTitle').textContent = era.label.split(' · ')[1] || era.label;
  document.getElementById('eraYear').textContent = era.label.split(' · ')[0];
  document.getElementById('eraDesc').textContent = era.desc;
  document.getElementById('slider').value = idx;

  // 지역 색칠
  const usedActors = new Set();
  ALL_REGIONS.forEach(id=>{
    const el = regionEls[id];
    if(!el) return;
    const ctrl = era.control[id];
    if(ctrl && ACTORS[ctrl]){
      el.style.fill = ACTORS[ctrl].color;
      el.style.stroke = ACTORS[ctrl].color;
      el.classList.add('controlled');
      usedActors.add(ctrl);
    } else {
      el.style.fill = 'transparent';
      el.style.stroke = '#8a7a5c';
      el.classList.remove('controlled');
    }
  });

  // 범례
  const legend = document.getElementById('legend');
  legend.innerHTML = '';
  usedActors.forEach(key=>{
    const a = ACTORS[key];
    const div = document.createElement('div');
    div.className = 'legend-item';
    div.innerHTML = '<span class="swatch" style="background:'+a.color+'"></span>'+a.label;
    legend.appendChild(div);
  });
  if(usedActors.size===0){
    legend.innerHTML = '<div class="legend-item">아직 뚜렷한 국경이 없는 시기입니다</div>';
  }

  // 마커 타입별 색·기호
  const MARKER_STYLE = {
    battle: {color:"#8c2f2f", symbol:"⚔", icon:"⚔"},
    person: {color:"#1f3f6e", symbol:"♛", icon:"♛"},
    event:  {color:"#b8860b", symbol:"●", icon:"●"}
  };

  // 이벤트 마커
  const g = document.getElementById('eventMarkers');
  g.innerHTML = '';
  era.events.forEach(ev=>{
    const st = MARKER_STYLE[ev.type] || MARKER_STYLE.event;
    const marker = document.createElementNS(svgNS,'g');
    marker.setAttribute('class','event-marker');
    const c = document.createElementNS(svgNS,'circle');
    c.setAttribute('cx', ev.x);
    c.setAttribute('cy', ev.y);
    c.setAttribute('r', 7);
    c.setAttribute('fill', st.color);
    marker.appendChild(c);
    const sym = document.createElementNS(svgNS,'text');
    sym.setAttribute('class','symbol');
    sym.setAttribute('x', ev.x);
    sym.setAttribute('y', parseFloat(ev.y)+2.8);
    sym.textContent = st.symbol;
    marker.appendChild(sym);
    const t = document.createElementNS(svgNS,'title');
    t.textContent = ev.title + ' — ' + ev.desc;
    marker.appendChild(t);
    g.appendChild(marker);
  });

  // 사건 목록
  const ul = document.getElementById('eventList');
  ul.innerHTML = '';
  if(era.events.length===0){
    ul.innerHTML = '<li>기록된 주요 사건 없음</li>';
  } else {
    era.events.forEach(ev=>{
      const st = MARKER_STYLE[ev.type] || MARKER_STYLE.event;
      const li = document.createElement('li');
      li.innerHTML = '<span class="ev-icon" style="color:'+st.color+'">'+st.icon+'</span><b>'+ev.title+'</b><br>'+ev.desc;
      ul.appendChild(li);
    });
  }

  // 눈금 활성 표시
  document.querySelectorAll('.tick').forEach((t,i)=>{
    t.classList.toggle('active', i===idx);
  });
}

// 눈금 생성
const ticksDiv = document.getElementById('ticks');
eras.forEach((era,i)=>{
  const btn = document.createElement('button');
  btn.className = 'tick';
  const y = era.year;
  btn.textContent = y<0 ? ('BC'+Math.abs(y)) : ('AD'+y);
  btn.onclick = ()=>applyEra(i);
  ticksDiv.appendChild(btn);
});

document.getElementById('slider').addEventListener('input', (e)=>applyEra(e.target.value));

// 자동 재생
let playing = false;
let timer = null;
document.getElementById('playBtn').addEventListener('click', ()=>{
  playing = !playing;
  document.getElementById('playBtn').textContent = playing ? '⏸' : '▶';
  if(playing){
    timer = setInterval(()=>{
      let v = parseInt(document.getElementById('slider').value);
      v = (v+1) % eras.length;
      applyEra(v);
      if(v === eras.length-1){
        playing = false;
        document.getElementById('playBtn').textContent = '▶';
        clearInterval(timer);
      }
    }, 2200);
  } else {
    clearInterval(timer);
  }
});

applyEra(0);
</script>
